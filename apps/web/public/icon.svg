<!--
  ProjectHub app icon — FULL DETAIL master (for raster sizes >= 57px).
  Concept: Expanded Radiant Hub Shield with 6 outer connection nodes.

  Geometry is the 512px projection of packages/ui/src/ProjectHubLogo.tsx
  (x21.33 from its 24px viewBox), so the OS icon and the in-app logo share one
  silhouette. Background is transparent — no container plate, and no glow
  filter: without a dark plate behind it a 12px blur reads as a grey halo on
  light taskbars instead of as depth.

  Do not edit derived copies. Regenerate them with:
    node scripts/branding/generate-icons.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Single-Tone Primary Gradient (Indigo Single Color Tone-on-Tone) -->
    <linearGradient id="single-tone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Expanded Radiant Hub Shield Base -->
  <g>
    <path
      d="M 256 25 L 450 115 V 290 C 450 395 355 470 256 490 C 157 470 62 395 62 290 V 115 L 256 25 Z"
      fill="url(#single-tone-grad)"
    />

    <!-- Radiant Inward Channels (6 Convergence Rays) -->
    <path
      d="M 256 50 V 240 M 90 140 L 245 245 M 422 140 L 267 245 M 100 300 L 245 260 M 412 300 L 267 260 M 256 460 V 272"
      stroke="#ffffff"
      stroke-width="32"
      stroke-linecap="round"
      stroke-opacity="0.85"
    />

    <!-- 6 Outer Connection Nodes (Including Bottom Node) -->
    <circle cx="256" cy="50" r="22" fill="#ffffff" />
    <circle cx="90" cy="140" r="22" fill="#ffffff" />
    <circle cx="422" cy="140" r="22" fill="#ffffff" />
    <circle cx="100" cy="300" r="22" fill="#ffffff" />
    <circle cx="412" cy="300" r="22" fill="#ffffff" />
    <circle cx="256" cy="460" r="22" fill="#ffffff" />

    <!-- Central Core Hub Node -->
    <circle cx="256" cy="256" r="50" fill="#ffffff" />
    <circle cx="256" cy="256" r="32" fill="#4338ca" />
  </g>
</svg>
